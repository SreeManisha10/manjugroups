name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          export PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          export VITE_BASE_PATH="$PAGES_BASE_PATH"
          npm run build
          find .output/public/assets -type f -name '*.js' -exec sed -i "s#TSS_ROUTER_BASEPATH:\\\`\\.\\`#TSS_ROUTER_BASEPATH:\\\`${PAGES_BASE_PATH}\\\`#g" {} +
          sed -i -E "s#/?(\.\.?/)?assets/#${PAGES_BASE_PATH}/assets/#g" .output/public/_shell.html
          cp .output/public/_shell.html .output/public/index.html
          cp .output/public/_shell.html .output/public/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
